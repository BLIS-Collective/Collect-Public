meta: 
  name: 
    full: BLIS Collective
    short: BLIS
  link: 
    home: https://www.bliscollective.org/
    github: https://github.com/BLIS-Collective
    linkedin: https://www.linkedin.com/company/blis-collective
    instagram: https://www.instagram.com/blis_collective/
  description: | 
    BLIS stands for Black Liberation-Indigenous Sovereignty. We’re a cross-movement Solidarity & Action Hub
    braiding narratives and growing movements to win policy and shift culture. We bring together 45 member 
    organizations and individuals to strengthen solidarity across movements, shift culture, and win 
    transformative policy.
  founded: 2023

